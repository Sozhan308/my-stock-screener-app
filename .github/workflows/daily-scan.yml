name: Stock Market Scan

on:
  schedule:
    # Weekdays at 18:00 IST = 12:30 UTC
    - cron: "30 12 * * 1-5"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Cached OHLCV bars let each run download only the latest few days.
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ohlcv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ohlcv-${{ runner.os }}-

      # NSE occasionally blocks cloud IPs; the committed snapshot is used if this fails.
      - name: Refresh F&O lot sizes
        continue-on-error: true
        run: uv run minervini update-fno

      # New listings and delistings; the committed list is used if NSE blocks this.
      - name: Refresh NSE universe
        continue-on-error: true
        run: uv run minervini update-universe

      - name: Run market scan
        run: uv run minervini update

      - name: Check generated output
        run: |
          test -s output/minervini_daily.csv
          test -s output/minervini_4h.csv

          echo "Generated files:"
          ls -lh output/

      - name: Commit updated scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/minervini_daily.csv
          git add output/minervini_daily.xlsx
          git add output/minervini_4h.csv
          git add output/minervini_4h.xlsx
          git add data/fno_lots.csv
          git add nse_symbols.csv

          if git diff --cached --quiet; then
            echo "No scan result changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily market scan"
          git fetch origin main
          git rebase origin/main

          git push origin main

      - name: Send Telegram digest
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run minervini notify
